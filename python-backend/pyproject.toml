[project]
name = "assistant-python-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for the intelligent assistant"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.60",
    "openpyxl>=3.1.5",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]
observability = [
    "langfuse>=3.0.0"
]
eval = [
    "deepeval>=4.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
